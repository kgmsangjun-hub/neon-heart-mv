<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>1207호의 비밀 — 60초 반전 드라마 쇼츠</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; gap: 20px; align-items: center; justify-content: center;
         background: #07070a; color: #ddd; font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 16px; flex-wrap: wrap; }
  canvas { height: min(calc(100vh - 32px), 1000px); aspect-ratio: 9 / 16; background: #000; border-radius: 12px; box-shadow: 0 20px 80px #0009; }
  .panel { width: 340px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, .file { background: #1b1b24; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  button:hover, .file:hover { background: #262634; }
  button.hot { border-color: #e0a84a; color: #ffd48a; }
  button:disabled { opacity: .5; cursor: default; }
  .file input { display: none; }
  .slot { border: 1px solid #2a2a36; border-radius: 8px; padding: 8px; font-size: 13px; line-height: 1.5; }
  .slot b { color: #ffd48a; }
  .slot small { color: #888; display: block; }
  input[type=range] { width: 100%; accent-color: #e0a84a; }
  #tc { font-variant-numeric: tabular-nums; font-size: 13px; }
  #status { font-size: 12px; color: #9a9ab0; min-height: 1.4em; }
  label { font-size: 13px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="panel">
  <h1>1207호의 비밀 · EP.1 (60초)</h1>
  <div class="slot"><b>① 서윤 (아내)</b> — 검정 수트 여성<small>정면·뒷모습·클로즈업 3컷 시트</small>
    <label class="file">🖼 이미지 선택<input id="f0" type="file" accept="image/*" /></label> <span id="s0">임시 실루엣</span></div>
  <div class="slot"><b>② 도현 (남편)</b> — 검정 수트 남성<small>뒷모습·클로즈업만 사용 (정면 컷은 얼굴이 없어 제외)</small>
    <label class="file">🖼 이미지 선택<input id="f1" type="file" accept="image/*" /></label> <span id="s1">임시 실루엣</span></div>
  <div class="slot"><b>③ 하린 (호텔 이벤트 매니저)</b> — 회색 블레이저 여성<small>성인 호텔 직원 역할</small>
    <label class="file">🖼 이미지 선택<input id="f2" type="file" accept="image/*" /></label> <span id="s2">임시 실루엣</span></div>
  <label><input id="key" type="checkbox" checked /> 회색 배경 자동 제거</label>
  <div class="row">
    <button id="play" class="hot">▶ 재생</button>
    <button id="restart">⏮ 처음부터</button>
    <span id="tc">00:00 / 01:00</span>
  </div>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" />
  <div class="row">
    <select id="quality">
      <option value="std">표준 (30fps · 약 35MB)</option>
      <option value="light">가벼운 파일 (30fps · 약 15MB)</option>
    </select>
    <button id="mp4" class="hot">⬇ MP4 다운로드</button>
  </div>
  <div id="status">음악 생성 중…</div>
</div>
<script>
/* =====================================================================
   「1207호의 비밀」 EP.1 — 60초 세로(9:16) 반전 드라마 쇼츠
   0–4   훅 : 아내 클로즈업 "결혼 7주년, 남편이 호텔에 있었다"
   4–14  호텔 로비 : 남편 → 프런트 매니저에게 카드키를 받음
   14–27 기둥 뒤 아내 / 남편·매니저 밀담 / 아내의 눈물
   27–34.6 엘리베이터 12층 → 1207호 문 앞 → 문을 열자
   34.6–50 반전① : 결혼 7주년 서프라이즈 파티
   50–60 반전② : 아내 휴대폰 "1208호에서 기다릴게" → 2화에서 계속
   ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920, CX = W / 2, CY = H / 2, DUR = 60;
const FONT = '"Noto Sans","Helvetica Neue",Arial,sans-serif';
const KFONT = '"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif';
const SERIF = '"Noto Serif KR","Nanum Myeongjo","Batang",Georgia,serif';
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outC = x => 1 - Math.pow(1 - x, 3);
const hash = x => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(s) { return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, Math.PI * 2); g.fill(); }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function text(str, x, y, size, color, o = {}) {
  const { weight = 800, align = 'center', alpha = 1, font = KFONT, stroke = 0, strokeColor = '#000', spacing = 0, shadow = 0 } = o;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = shadow; }
  if (stroke) { ctx.strokeStyle = strokeColor; ctx.lineWidth = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); ctx.shadowBlur = 0; }
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
}

// =====================================================================
// 1) 인물 — 캐릭터 시트 → 정면/뒷모습/클로즈업 자동 분할 + 배경 제거
// =====================================================================
function boxBlur(a, w, h, r) {
  const t = new Float32Array(a.length), o = new Float32Array(a.length), k = 2 * r + 1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0; for (let i = -r; i <= r; i++) s += a[y * w + clamp(x + i, 0, w - 1)]; t[y * w + x] = s / k; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0; for (let i = -r; i <= r; i++) s += t[clamp(y + i, 0, h - 1) * w + x]; o[y * w + x] = s / k; }
  return o;
}
// 가장자리와 연결된 무채색 회색 영역을 제거. 성공 시 알파 마스크(Uint8) 반환
function keyOut(c) {
  const g = c.getContext('2d', { willReadFrequently: true });
  const w = c.width, h = c.height, n = w * h, id = g.getImageData(0, 0, w, h), d = id.data, bg = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = d[p], gg = d[p + 1], b = d[p + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = 0.299 * r + 0.587 * gg + 0.114 * b;
    bg[i] = (mx - mn < 18 && Math.abs(r - b) < 14 && l > 70 && l < 235) ? 1 : 0;
  }
  const m = new Uint8Array(n), st = new Int32Array(n); let sp = 0;
  const push = i => { if (bg[i] && !m[i]) { m[i] = 1; st[sp++] = i; } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) { const i = st[--sp], x = i % w; if (x > 0) push(i - 1); if (x < w - 1) push(i + 1); if (i >= w) push(i - w); if (i < n - w) push(i + w); }
  let removed = 0; const a = new Float32Array(n);
  for (let i = 0; i < n; i++) { a[i] = m[i] ? 0 : 1; removed += m[i]; }
  const ratio = removed / n;
  if (ratio < 0.2 || ratio > 0.93) return { ok: false, ratio };
  const f = boxBlur(a, w, h, 2);
  for (let i = 0; i < n; i++) d[i * 4 + 3] = Math.round(d[i * 4 + 3] * clamp((f[i] - 0.35) / 0.65));
  g.putImageData(id, 0, 0);
  return { ok: true, ratio };
}
// 알파 기준으로 인물이 있는 세로 구간을 찾아 3컷으로 분할
function findPanels(c) {
  const w = c.width, h = c.height, d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const col = new Float32Array(w);
  for (let x = 0; x < w; x++) { let s = 0; for (let y = 0; y < h; y += 2) if (d[(y * w + x) * 4 + 3] > 128) s++; col[x] = s / (h / 2); }
  const segs = []; let st = -1;
  for (let x = 0; x <= w; x++) {
    const on = x < w && col[x] > 0.012;
    if (on && st < 0) st = x;
    if (!on && st >= 0) { segs.push([st, x]); st = -1; }
  }
  const merged = [];
  for (const s of segs) { const l = merged[merged.length - 1]; if (l && s[0] - l[1] < w * 0.025) l[1] = s[1]; else merged.push([...s]); }
  const big = merged.filter(s => s[1] - s[0] > w * 0.05).sort((a, b) => (b[1] - b[0]) - (a[1] - a[0])).slice(0, 3).sort((a, b) => a[0] - b[0]);
  if (big.length < 3) return null;
  return big.map(([x0, x1]) => {
    let y0 = h, y1 = 0;
    for (let y = 0; y < h; y += 2) for (let x = x0; x < x1; x += 3) if (d[(y * w + x) * 4 + 3] > 128) { if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return [Math.max(0, x0 - 6), Math.max(0, y0 - 6), Math.min(w, x1 + 6), Math.min(h, y1 + 8)];
  });
}
function cropC(src, x0, y0, x1, y1) {
  const c = mk(Math.max(1, Math.round(x1 - x0)), Math.max(1, Math.round(y1 - y0)));
  c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height); return c;
}
// 정면/뒷모습: 발끝(하단 중앙) 기준, 클로즈업: 얼굴 기준
const shot = (img, fx, fy) => ({ img, fx, fy });
function processSheet(img, key) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, sc = Math.min(1, 2000 / iw);
  const w = Math.round(iw * sc), h = Math.round(ih * sc), base = mk(w, h);
  base.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, w, h);
  let msg = '원본 사용', panels = null;
  if (key) {
    try { const r = keyOut(base); if (r.ok) { panels = findPanels(base); msg = `배경 제거 ${Math.round(r.ratio * 100)}%`; } else msg = '배경을 찾지 못해 원본 사용'; }
    catch (e) { msg = '배경 제거 불가'; }
  }
  if (!panels) {   // 고정 비율 분할 (정면 0–31%, 뒷모습 31–60%, 클로즈업 60–100%)
    panels = [[0, 0, 0.31 * w, h], [0.31 * w, 0, 0.6 * w, h], [0.6 * w, 0, w, h]];
    msg += ' · 고정 비율 분할';
  } else msg += ' · 3컷 자동 분할';
  const [f, b, c] = panels.map(p => cropC(base, ...p));
  return { set: { front: shot(f, 0.5, 1), back: shot(b, 0.5, 1), close: shot(c, 0.45, 0.33) }, msg };
}

// 임시 실루엣 (이미지를 넣기 전 미리보기용)
function placeholder(o) {
  const { skin = '#e2b9a0', suit = '#141418', hair = '#0c0c0e', long = true, shirt = null, bow = null, skirt = null, pants = false } = o;
  const body = (g, face) => {
    g.fillStyle = hair;
    if (long) { g.beginPath(); g.ellipse(200, 120, 78, 110, 0, 0, 7); g.fill(); g.fillRect(124, 120, 152, 230); }
    else { g.beginPath(); g.ellipse(200, 108, 66, 76, 0, 0, 7); g.fill(); }
    if (face) { g.fillStyle = skin; g.beginPath(); g.ellipse(200, 122, 50, 64, 0, 0, 7); g.fill(); }
    g.fillStyle = skin; g.fillRect(184, 176, 32, 44);
    g.fillStyle = suit; g.beginPath(); g.moveTo(112, 214); g.lineTo(288, 214); g.lineTo(306, 520); g.lineTo(94, 520); g.closePath(); g.fill();
    if (face && shirt) { g.fillStyle = shirt; g.beginPath(); g.moveTo(180, 214); g.lineTo(220, 214); g.lineTo(200, 330); g.closePath(); g.fill(); }
    if (face && bow) { g.fillStyle = bow; g.beginPath(); g.moveTo(200, 232); g.lineTo(160, 212); g.lineTo(160, 256); g.closePath(); g.moveTo(200, 232); g.lineTo(240, 212); g.lineTo(240, 256); g.closePath(); g.fill(); }
    if (!face && long) { g.fillStyle = hair; g.fillRect(128, 60, 144, 300); }
    if (pants) { g.fillStyle = suit; g.fillRect(118, 520, 76, 440); g.fillRect(206, 520, 76, 440); g.fillStyle = '#050505'; g.fillRect(112, 950, 86, 30); g.fillRect(202, 950, 86, 30); }
    else {
      g.fillStyle = skirt || suit; g.fillRect(116, 520, 168, 110);
      g.fillStyle = skin; g.fillRect(142, 630, 38, 320); g.fillRect(220, 630, 38, 320);
      g.fillStyle = '#050505'; g.fillRect(134, 950, 50, 30); g.fillRect(216, 950, 50, 30);
    }
  };
  const f = mk(400, 990); body(f.getContext('2d'), true);
  const b = mk(400, 990); body(b.getContext('2d'), false);
  const c = mk(800, 1000), g = c.getContext('2d');
  g.fillStyle = hair;
  if (long) { g.beginPath(); g.ellipse(400, 380, 290, 350, 0, 0, 7); g.fill(); g.fillRect(110, 380, 580, 420); }
  else { g.beginPath(); g.ellipse(400, 300, 230, 250, 0, 0, 7); g.fill(); }
  g.fillStyle = skin; g.beginPath(); g.ellipse(400, 380, 185, 235, 0, 0, 7); g.fill(); g.fillRect(335, 560, 130, 150);
  g.fillStyle = suit; g.beginPath(); g.moveTo(20, 1000); g.lineTo(150, 720); g.lineTo(650, 720); g.lineTo(780, 1000); g.fill();
  if (shirt) { g.fillStyle = shirt; g.beginPath(); g.moveTo(330, 720); g.lineTo(470, 720); g.lineTo(400, 900); g.fill(); }
  if (bow) { g.fillStyle = bow; g.beginPath(); g.moveTo(400, 770); g.lineTo(300, 720); g.lineTo(300, 830); g.closePath(); g.moveTo(400, 770); g.lineTo(500, 720); g.lineTo(500, 830); g.closePath(); g.fill(); }
  g.fillStyle = '#2a1a1a'; g.beginPath(); g.ellipse(330, 360, 32, 13, 0, 0, 7); g.ellipse(470, 360, 32, 13, 0, 0, 7); g.fill();
  g.fillStyle = '#b86a66'; g.beginPath(); g.ellipse(400, 500, 42, 13, 0, 0, 7); g.fill();
  return { front: shot(f, 0.5, 1), back: shot(b, 0.5, 1), close: shot(c, 0.5, 0.36) };
}
const CAST = [
  placeholder({ long: true }),                                                    // 서윤
  placeholder({ long: false, pants: true, skin: '#d8ad92' }),                     // 도현
  placeholder({ long: true, suit: '#3a3b40', shirt: '#f2f2f2', bow: '#9aa3b5', skirt: '#9aa3b5' }), // 하린
];
const WIFE = 0, HUSB = 1, MGR = 2;

// 인물 그리기: (x, y)는 기준점(정면·뒷모습=발끝, 클로즈업=얼굴), h=표시 높이
function fig(who, kind, x, y, h, o = {}) {
  const s = CAST[who][kind], im = s.img, w = h * im.width / im.height;
  const { flip = false, alpha = 1, glow = null, blur = 0, dark = 0 } = o;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
  if (kind !== 'close' && !o.noShadow) {   // 바닥 그림자
    ctx.save(); ctx.globalAlpha *= 0.45; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(0, 0, w * 0.42, h * 0.018, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 40; }
  if (blur) ctx.filter = `blur(${blur}px)` + (dark ? ` brightness(${1 - dark})` : '');
  else if (dark) ctx.filter = `brightness(${1 - dark})`;
  ctx.drawImage(im, -w * s.fx, -h * s.fy, w, h);
  ctx.restore();
}

// =====================================================================
// 2) 배경 — 호텔 뤼미에르 로비 / 엘리베이터 / 12층 복도 / 1207호
// =====================================================================
const BW = W + 360, BH = H + 240;       // 패닝 여유
const R = rng(1207);
function blurCopy(c, px, bright = 1) { const o = mk(c.width, c.height), g = o.getContext('2d'); g.filter = `blur(${px}px) brightness(${bright})`; g.drawImage(c, 0, 0); return o; }

const LOBBY = (() => {
  const back = mk(BW, BH), g = back.getContext('2d'), FL = 1380;   // 바닥 시작선
  // 벽
  let gr = g.createLinearGradient(0, 0, 0, FL);
  gr.addColorStop(0, '#120c08'); gr.addColorStop(0.5, '#3a2616'); gr.addColorStop(1, '#5b3d22');
  g.fillStyle = gr; g.fillRect(0, 0, BW, FL);
  // 뒤쪽 통창 (밤 도시)
  for (let i = 0; i < 4; i++) {
    const x = 90 + i * 350, y = 380, w = 260, h = 760;
    const wg = g.createLinearGradient(0, y, 0, y + h); wg.addColorStop(0, '#060b1e'); wg.addColorStop(1, '#1b2146');
    g.fillStyle = wg; g.fillRect(x, y, w, h);
    for (let k = 0; k < 90; k++) { g.fillStyle = R() < 0.7 ? `rgba(255,205,140,${0.3 + R() * 0.6})` : `rgba(170,210,255,${0.3 + R() * 0.6})`; g.fillRect(x + R() * w, y + 300 + R() * (h - 300), 3, 4); }
    g.strokeStyle = '#b8894a'; g.lineWidth = 10; g.strokeRect(x, y, w, h);
    g.fillStyle = '#b8894a'; g.fillRect(x + w / 2 - 3, y, 6, h); g.fillRect(x, y + h * 0.45, w, 6);
  }
  // 금빛 기둥
  for (const x of [20, 640, 1260]) {
    const pg = g.createLinearGradient(x, 0, x + 150, 0);
    pg.addColorStop(0, '#4a3014'); pg.addColorStop(0.35, '#e8c27a'); pg.addColorStop(0.6, '#a67a3c'); pg.addColorStop(1, '#3a250f');
    g.fillStyle = pg; g.fillRect(x, 150, 150, FL - 150);
    g.fillStyle = '#d9b06a'; g.fillRect(x - 16, 150, 182, 30); g.fillRect(x - 16, FL - 40, 182, 40);
  }
  // 샹들리에
  const chand = (cx, cy, s) => {
    g.strokeStyle = 'rgba(230,200,140,.6)'; g.lineWidth = 3; g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, cy - 60 * s); g.stroke();
    const lg = g.createRadialGradient(cx, cy, 0, cx, cy, 380 * s); lg.addColorStop(0, 'rgba(255,220,150,.55)'); lg.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = lg; g.fillRect(cx - 400 * s, cy - 400 * s, 800 * s, 800 * s);
    for (let ring = 0; ring < 3; ring++) for (let k = 0; k < 14 - ring * 3; k++) {
      const a = k / (14 - ring * 3) * Math.PI * 2, rx = (150 - ring * 45) * s, x = cx + Math.cos(a) * rx, y = cy + ring * 50 * s + Math.sin(a) * rx * 0.25;
      g.fillStyle = 'rgba(255,240,200,.35)'; circle(g, x, y, 14 * s); g.fillStyle = '#fff6dc'; circle(g, x, y, 5 * s);
      g.strokeStyle = 'rgba(255,235,190,.35)'; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 36 * s); g.stroke();
    }
  };
  chand(BW / 2, 250, 1.3); chand(260, 200, 0.8); chand(BW - 260, 200, 0.8);

  const mvhd = box('mvhd', full(0, 0), u32(0), u32(0), u32(1000), u32(ms), u32(0x10000), u16(0x100), u16(0),

  const build = offs => box('moov', mvhd, ...tracks.map((tr, i) => trak(tr, i + 1, offs[i])));
  const sizes = tracks.map(tr => tr.samples.reduce((a, s) => a + s.data.length, 0));
  let o = ftyp.length + build(tracks.map(() => 0)).length + 8;
  const offs = sizes.map(s => { const r = o; o += s; return r; });
  const moov = build(offs);
  return new Blob([ftyp, moov, new Uint8Array(u32(sizes.reduce((a, b) => a + b, 0) + 8)), TE.encode('mdat'),
                   ...tracks.flatMap(tr => tr.samples.map(s => s.data))], { type: 'video/mp4' });
}
const toU8 = d => (d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer, d.byteOffset, d.byteLength)).slice();

async function encodeAudio(buf) {
  if (!window.AudioEncoder || !buf) return null;
  const sr = buf.sampleRate, ch = buf.numberOfChannels;
  const cands = [
    { kind: 'aac', cfg: { codec: 'mp4a.40.2', sampleRate: sr, numberOfChannels: ch, bitrate: 192000, aac: { format: 'aac' } } },
    { kind: 'opus', cfg: { codec: 'opus', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 } },
  ];
  let pick = null;
  for (const c of cands) { try { if ((await AudioEncoder.isConfigSupported(c.cfg)).supported) { pick = c; break; } } catch (e) {} }
  if (!pick) return null;
  const samples = [], deltas = []; let desc = null, err = null;
  const enc = new AudioEncoder({
    output: (chunk, meta) => {
      const d = meta && meta.decoderConfig && meta.decoderConfig.description; if (d && !desc) desc = toU8(d);
      const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); samples.push({ data: b, key: true });
      deltas.push(chunk.duration ? Math.round(chunk.duration * sr / 1e6) : (pick.kind === 'aac' ? 1024 : 960));
    },
    error: e => { err = e; },
  });
  enc.configure(pick.cfg);
  const L = buf.length, STEP = 4800, chans = [...Array(ch)].map((_, i) => buf.getChannelData(i));
  for (let i = 0; i < L; i += STEP) {
    const n = Math.min(STEP, L - i), data = new Float32Array(n * ch);
    for (let c = 0; c < ch; c++) data.set(chans[c].subarray(i, i + n), c * n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(i / sr * 1e6), data });
    enc.encode(ad); ad.close();
  }
  await enc.flush(); enc.close();
  if (err || !samples.length) return null;
  return { kind: 'audio', samples, deltas, timescale: sr, entry: audioEntry(pick.kind, desc, sr, ch), codec: pick.kind };
}


async function exportMP4(onProgress = () => {}, opt = {}) {
  if (!window.VideoEncoder) throw new Error('이 브라우저는 WebCodecs(VideoEncoder)를 지원하지 않습니다. 최신 Chrome/Edge를 사용해 주세요.');
  const light = opt.light ?? ($('quality').value === 'light'), fps = 30;
  let cfg = null;
  for (const codec of ['avc1.640028', 'avc1.64002A', 'avc1.4D0028', 'avc1.42E028']) {
    const c = { codec, width: W, height: H, bitrate: light ? 2e6 : 4.5e6, framerate: fps, avc: { format: 'avc' } };
    if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; break; }
  }
  if (!cfg) throw new Error('H.264 인코딩을 지원하지 않는 브라우저입니다.');
  const samples = []; let avcC = null, err = null;
  const venc = new VideoEncoder({
    output: (chunk, meta) => {
      const d = meta && meta.decoderConfig && meta.decoderConfig.description; if (d && !avcC) avcC = toU8(d);
      const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); samples.push({ data: b, key: chunk.type === 'key' });
    },
    error: e => { err = e; },
  });
  venc.configure(cfg);
  const N = DUR * fps, us = 1e6 / fps;
  exporting = true;
  try {
    for (let i = 0; i < N; i++) {
      if (err) throw err;
      render(i / fps);
      const f = new VideoFrame(cv, { timestamp: Math.round(i * us), duration: Math.round(us) });
      venc.encode(f, { keyFrame: i % (fps * 2) === 0 }); f.close();
      while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (i % 10 === 0) { onProgress(0.97 * i / N); await new Promise(r => setTimeout(r, 0)); }
    }
    await venc.flush(); venc.close();
    if (err) throw err;
    if (!avcC) throw new Error('인코더가 코덱 설정(avcC)을 반환하지 않았습니다.');
    const vt = { kind: 'video', samples, deltas: samples.map(() => 100), timescale: fps * 100, entry: videoEntry(avcC, W, H), w: W, h: H };
    const at = await encodeAudio(await audioReady);
    lastExportInfo = { fps, codec: cfg.codec, videoFrames: samples.length, audio: at ? at.codec : 'none' };
    onProgress(1);
    return mp4Mux(at ? [vt, at] : [vt]);
  } finally { exporting = false; }
}
let lastExportInfo = null;
window.exportMP4 = exportMP4; window.getExportInfo = () => lastExportInfo;

// =====================================================================
// 6) 플레이어
// =====================================================================
let playing = false, cur = 0, pbase = 0, exporting = false, audioBuf = null, actx = null, src = null, t0 = 0;
const setStatus = s => { $('status').textContent = s; };
const audioReady = makeAudio().then(b => { audioBuf = b; setStatus('준비 완료 · 인물 이미지 3장을 넣어 주세요'); return b; })
  .catch(e => { setStatus('오디오 생성 실패: ' + e.message); return null; });
window.audioReady = audioReady;

function stopAudio() { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; } }
function startAudio(off) {
  stopAudio(); if (!audioBuf) return;
  if (!actx) actx = new AudioContext({ sampleRate: 48000 });
  actx.resume(); src = actx.createBufferSource(); src.buffer = audioBuf; src.connect(actx.destination); src.start(0, off); t0 = actx.currentTime - off;
}
function setPlayLabel() { $('play').textContent = playing ? '⏸ 일시정지' : '▶ 재생'; }
function play() { if (cur >= DUR - 0.02) cur = 0; playing = true; pbase = performance.now() - cur * 1000; startAudio(cur); setPlayLabel(); }
function pause() { playing = false; stopAudio(); setPlayLabel(); }
function seek(t) { cur = t; if (playing) { pbase = performance.now() - t * 1000; startAudio(t); } }
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function loop(now) {
  if (!exporting) {
    if (playing) { cur = src ? actx.currentTime - t0 : (now - pbase) / 1000; if (cur >= DUR) { cur = DUR - 0.001; pause(); } }
    render(cur); $('scrub').value = cur.toFixed(2); $('tc').textContent = `${fmt(cur)} / 01:00`;
  }
  requestAnimationFrame(loop);
}
$('play').onclick = () => (playing ? pause() : play());
$('restart').onclick = () => { cur = 0; play(); };
$('scrub').oninput = e => seek(+e.target.value);

const srcImgs = [null, null, null];
function applyImage(i) {
  if (!srcImgs[i]) return;
  const r = processSheet(srcImgs[i], $('key').checked);
  CAST[i] = r.set; $('s' + i).textContent = r.msg;
}
function loadCast(i, url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { srcImgs[i] = im; applyImage(i); res(); };
    im.onerror = () => { $('s' + i).textContent = '이미지를 읽지 못했습니다'; rej(new Error('load failed')); };
    im.src = url;
  });
}
window.loadCast = loadCast;
[0, 1, 2].forEach(i => { $('f' + i).onchange = e => { const f = e.target.files[0]; if (f) loadCast(i, URL.createObjectURL(f)); }; });
$('key').onchange = () => [0, 1, 2].forEach(applyImage);

$('mp4').onclick = async () => {
  const btn = $('mp4'); if (playing) pause(); btn.disabled = true;
  try {
    const blob = await exportMP4(p => { btn.textContent = `렌더링 ${Math.round(p * 100)}%`; });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '1207-secret-ep1-60s.mp4'; a.click();
    setStatus(`MP4 완료 · ${(blob.size / 1e6).toFixed(1)}MB · 오디오 ${lastExportInfo.audio.toUpperCase()}`);
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = '⬇ MP4 다운로드';
};
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(loop));
