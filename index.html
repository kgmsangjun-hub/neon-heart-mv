<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEON HEART — 15s K-POP M/V Showreel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: #050508; color: #ddd;
    font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 16px;
  }
  .stage { position: relative; width: min(100%, calc((100vh - 170px) * 16 / 9)); }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; box-shadow: 0 20px 80px #0008; }
  .drop {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    border: 2px dashed #ff2d95aa; border-radius: 8px; background: #000a; font-size: 18px; line-height: 1.7;
    pointer-events: none; transition: opacity .3s;
  }
  .drop.hide { opacity: 0; }
  .drop.over { background: #ff2d9533; }
  .bar { display: flex; align-items: center; gap: 10px; width: min(100%, 1000px); flex-wrap: wrap; }
  button, .file {
    background: #1b1b24; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 8px 14px;
    font-size: 14px; cursor: pointer;
  }
  button:hover, .file:hover { background: #262634; }
  button.hot { border-color: #ff2d95; color: #ff79bb; }
  button:disabled { opacity: .5; cursor: default; }
  .file input { display: none; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: #ff2d95; }
  #tc { font-variant-numeric: tabular-nums; font-size: 14px; width: 110px; text-align: right; }
  label { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  select { background: #1b1b24; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 7px; }
  #status { font-size: 13px; color: #9a9ab0; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="drop" class="drop">여기에 인물 이미지를 끌어다 놓거나<br /><b>[이미지 선택]</b>을 눌러 주세요<br /><small>(지금은 임시 실루엣으로 미리보기 중)</small></div>
</div>
<div class="bar">
  <button id="play" class="hot">▶ 재생</button>
  <button id="restart">⏮ 처음부터</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" />
  <span id="tc">00:00 / 00:15</span>
  <select id="quality">
    <option value="high">고화질 (60fps · 약 30MB)</option>
    <option value="light">가벼운 파일 (30fps · 약 6MB)</option>
  </select>
  <button id="mp4" class="hot">⬇ MP4 다운로드</button>
</div>
<div class="bar">
  <label class="file">🖼 이미지 선택<input id="file" type="file" accept="image/*" /></label>
  <select id="layout">
    <option value="auto">레이아웃: 자동</option>
    <option value="sheet">캐릭터 시트 (정면·뒷모습·클로즈업 3컷)</option>
    <option value="single">단일 사진</option>
  </select>
  <label><input id="key" type="checkbox" checked /> 배경 자동 제거</label>
  <label><input id="mute" type="checkbox" /> 음소거</label>
  <span id="status">비트 생성 중…</span>
</div>
<div class="bar">
  <label class="file">🎵 노래 파일 선택<input id="music" type="file" accept="audio/*" /></label>
  <select id="amode">
    <option value="beat">음악: 기본 비트 (반주만)</option>
    <option value="song">업로드한 노래만</option>
    <option value="mix">노래 + 기본 비트 섞기</option>
  </select>
  <label>노래 시작 위치 <input id="aoff" type="number" min="0" step="0.5" value="0" style="width:70px" />초</label>
</div>
<details class="bar" style="display:block">
  <summary style="cursor:pointer;font-size:14px">✏️ 가사 자막 편집 <small style="color:#888">(형식: 시작초 끝초 가사 — 한 줄에 하나)</small></summary>
  <textarea id="lyrics" rows="8" spellcheck="false"
    style="width:100%;margin-top:8px;background:#111118;color:#eee;border:1px solid #333;border-radius:6px;padding:10px;font:14px/1.6 ui-monospace,monospace"></textarea>
  <div id="lyrinfo" style="font-size:12px;color:#888"></div>
</details>

<script>
/* =====================================================================
   NEON HEART — 15초 K-POP 뮤직비디오 쇼릴
   · 128 BPM, 8마디 = 정확히 15초 (1박 = 0.46875s)
   · 박자(beat) 기준 구성
     0–8   인트로   : 뒷모습 실루엣 → 눈 클로즈업 + 타이틀
     8–16  벌스     : 정면 전신 바운스 → 3분할 → 빌드업(줌·스트로브)
     16–28 드롭     : 박자마다 컷 전환 (RGB 글리치 / 잔상 / 3분할 / 미러 / 4분할 / 히어로)
     28–30 엔딩     : 클로즈업 + 스파클
     30–32 타이틀   : 네온 타이틀 카드 → 페이드아웃
   ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { willReadFrequently: false });
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DUR = 15;
const BPM = 128, B = 60 / BPM;
const FONT = '"Inter","Helvetica Neue","Noto Sans",Arial,sans-serif';
const KFONT = '"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif';
const C = { pink: '#ff2d95', cyan: '#00e5ff', violet: '#8a2be2', gold: '#ffc94d', white: '#ffffff' };
const TITLE = 'NEON HEART', ARTIST = 'LUNA';

// ---------------- utils ----------------
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
};
const hash = x => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(s) { return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function ring(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.stroke(); }
function fillAll(style) { ctx.fillStyle = style; ctx.fillRect(-200, -200, W + 400, H + 400); }
function text(str, x, y, size, color, o = {}) {
  const { weight = 900, align = 'center', alpha = 1, spacing = 0, stroke = 0, font = FONT } = o;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  const dx = align === 'center' ? spacing / 2 : 0;
  if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x + dx, y); }
  else { ctx.fillStyle = color; ctx.fillText(str, x + dx, y); }
  ctx.restore();
}

// =====================================================================
// 1) 인물 이미지 → 3컷(정면/뒷모습/클로즈업) + 배경 제거
// =====================================================================
let SH = null, srcImg = null;

function boxBlur(a, w, h, r) {
  const t = new Float32Array(a.length), o = new Float32Array(a.length), k = 2 * r + 1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0; for (let i = -r; i <= r; i++) s += a[y * w + clamp(x + i, 0, w - 1)]; t[y * w + x] = s / k;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0; for (let i = -r; i <= r; i++) s += t[clamp(y + i, 0, h - 1) * w + x]; o[y * w + x] = s / k;
  }
  return o;
}

// 가장자리와 연결된 "무채색 중간 밝기" 영역(스튜디오 회색 배경)을 flood-fill로 제거
function keyOut(c) {
  const g = c.getContext('2d', { willReadFrequently: true });
  const w = c.width, h = c.height, n = w * h;
  const id = g.getImageData(0, 0, w, h), d = id.data;
  const bg = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = d[p], gg = d[p + 1], b = d[p + 2];
    const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = 0.299 * r + 0.587 * gg + 0.114 * b;
    bg[i] = (mx - mn < 16 && r - b < 12 && l > 50 && l < 232) ? 1 : 0;
  }
  const m = new Uint8Array(n), st = new Int32Array(n); let sp = 0;
  const push = i => { if (bg[i] && !m[i]) { m[i] = 1; st[sp++] = i; } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const i = st[--sp], x = i % w;
    if (x > 0) push(i - 1); if (x < w - 1) push(i + 1); if (i >= w) push(i - w); if (i < n - w) push(i + w);
  }
  let removed = 0; const a = new Float32Array(n);
  for (let i = 0; i < n; i++) { a[i] = m[i] ? 0 : 1; removed += m[i]; }
  const ratio = removed / n;
  if (ratio < 0.15 || ratio > 0.92) return ratio;          // 실패로 판단 → 원본 유지
  const f = boxBlur(a, w, h, 2);
  for (let i = 0; i < n; i++) d[i * 4 + 3] = Math.round(d[i * 4 + 3] * clamp((f[i] - 0.35) / 0.65));
  g.putImageData(id, 0, 0);
  return ratio;
}

function buildShots(img) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  let lay = $('layout').value;
  if (lay === 'auto') lay = (iw / ih > 1.6 && iw / ih < 1.95) ? 'sheet' : 'single';
  const sc = Math.min(1, 2400 / iw), w = Math.round(iw * sc), h = Math.round(ih * sc);
  const base = mk(w, h); base.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, w, h);
  let msg = lay === 'sheet' ? '캐릭터 시트 3컷' : '단일 사진';
  if ($('key').checked) {
    try {
      const r = keyOut(base);
      msg += (r >= 0.15 && r <= 0.92) ? ` · 배경 제거 완료 (${Math.round(r * 100)}%)` : ' · 배경을 찾지 못해 원본 사용';
    } catch (e) { msg += ' · 배경 제거 불가(보안 제한)'; }
  }
  const crop = (x0, y0, x1, y1, fx, fy) => {
    const c = mk(Math.max(1, Math.round((x1 - x0) * w)), Math.max(1, Math.round((y1 - y0) * h)));
    c.getContext('2d').drawImage(base, x0 * w, y0 * h, c.width, c.height, 0, 0, c.width, c.height);
    return { img: c, fx, fy };
  };
  if (lay === 'sheet') SH = {
    front: crop(0.02, 0.02, 0.29, 0.995, 0.5, 0.5),
    back: crop(0.325, 0.02, 0.585, 0.995, 0.5, 0.5),
    close: crop(0.60, 0, 1, 1, 0.38, 0.36),   // 얼굴 위치(눈 높이) 기준 포커스
  };
  else SH = { front: crop(0, 0, 1, 1, 0.5, 0.5), back: crop(0, 0, 1, 1, 0.5, 0.5), close: crop(0.1, 0, 0.9, 0.6, 0.5, 0.45) };
  setStatus(msg);
}

// 이미지가 없을 때 쓰는 임시 실루엣
function placeholder() {
  const skin = '#e6bea4', blk = '#121216';
  const body = (g, face) => {
    g.fillStyle = blk; g.beginPath(); g.ellipse(200, 120, 80, 112, 0, 0, Math.PI * 2); g.fill(); g.fillRect(122, 120, 156, 200);
    if (face) { g.fillStyle = skin; g.beginPath(); g.ellipse(200, 118, 52, 66, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = skin; g.fillRect(186, 176, 28, 40);
    g.fillStyle = blk; g.beginPath(); g.moveTo(118, 212); g.lineTo(282, 212); g.lineTo(312, 520); g.lineTo(88, 520); g.closePath(); g.fill();
    g.fillRect(116, 520, 168, 110);
    g.fillStyle = skin; g.fillRect(140, 630, 40, 320); g.fillRect(220, 630, 40, 320);
    g.fillStyle = blk; g.fillRect(132, 950, 52, 30); g.fillRect(216, 950, 52, 30);
    if (!face) { g.fillStyle = blk; g.fillRect(122, 60, 156, 280); }
  };
  const f = mk(400, 1000); body(f.getContext('2d'), true);
  const b = mk(400, 1000); body(b.getContext('2d'), false);
  const c = mk(800, 1000), g = c.getContext('2d');
  g.fillStyle = blk; g.beginPath(); g.ellipse(400, 380, 300, 360, 0, 0, Math.PI * 2); g.fill(); g.fillRect(100, 380, 600, 380);
  g.fillStyle = skin; g.beginPath(); g.ellipse(400, 370, 190, 240, 0, 0, Math.PI * 2); g.fill(); g.fillRect(340, 560, 120, 140);
  g.fillStyle = blk; g.beginPath(); g.moveTo(40, 1000); g.lineTo(160, 720); g.lineTo(640, 720); g.lineTo(760, 1000); g.fill();
  g.fillStyle = '#2a1a1a'; g.beginPath(); g.ellipse(330, 350, 34, 14, 0, 0, Math.PI * 2); g.ellipse(470, 350, 34, 14, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#c86a6a'; g.beginPath(); g.ellipse(400, 490, 44, 14, 0, 0, Math.PI * 2); g.fill();
  return { front: { img: f, fx: .5, fy: .5 }, back: { img: b, fx: .5, fy: .5 }, close: { img: c, fx: .5, fy: .36 } };
}
SH = placeholder();

// 인물 레이어 합성 (틴트 → RGB 분리 → 네온 글로우)
const figL = mk(W, H), tmpL = mk(W, H);
const fg = figL.getContext('2d'), tg = tmpL.getContext('2d');
function drawShot(g, s, cx, cy, h, flip) {
  const im = s.img, w = h * im.width / im.height;
  g.save(); g.translate(cx, cy); if (flip) g.scale(-1, 1);
  g.drawImage(im, -w * s.fx, -h * s.fy, w, h); g.restore();
}
function prepFig(s, cx, cy, h, o = {}) {
  const { flip = false, tint = 0.3, tintA = C.pink, tintB = C.cyan } = o;
  fg.setTransform(1, 0, 0, 1, 0, 0); fg.globalCompositeOperation = 'source-over'; fg.globalAlpha = 1;
  fg.clearRect(0, 0, W, H);
  drawShot(fg, s, cx, cy, h, flip);
  if (tint > 0) {
    fg.globalCompositeOperation = 'source-atop';
    const gr = fg.createLinearGradient(cx - h * 0.35, 0, cx + h * 0.35, 0);
    gr.addColorStop(0, tintA); gr.addColorStop(1, tintB);
    fg.globalAlpha = tint; fg.fillStyle = gr; fg.fillRect(0, 0, W, H);
    fg.globalAlpha = 1; fg.globalCompositeOperation = 'source-over';
  }
}
function blitFig(o = {}) {
  const { rgb = 0, glow = C.pink, glowBlur = 30, alpha = 1 } = o;
  if (rgb > 0.5) {
    for (const [col, dx] of [[C.pink, -rgb], [C.cyan, rgb]]) {
      tg.globalCompositeOperation = 'source-over'; tg.clearRect(0, 0, W, H); tg.drawImage(figL, 0, 0);
      tg.globalCompositeOperation = 'source-atop'; tg.fillStyle = col; tg.fillRect(0, 0, W, H);
      ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.75 * alpha; ctx.drawImage(tmpL, dx, 0); ctx.restore();
    }
  }
  ctx.save(); ctx.globalAlpha = alpha;
  if (glowBlur > 0) { ctx.shadowColor = glow; ctx.shadowBlur = glowBlur; }
  ctx.drawImage(figL, 0, 0); ctx.restore();
}

// =====================================================================
// 2) 배경 · 조명 · 효과
// =====================================================================
// ---------------------------------------------------------------------
// 서울 야경 (15초 연속 · 패럴랙스 패닝)
//   하늘/별/달 → 남산+N서울타워 → 스카이라인(63빌딩·롯데월드타워)
//   → 강변도로 차량 불빛 → 한강 반사 → 반포대교 + 무지개 분수 → 보케 → 옥상
// ---------------------------------------------------------------------
const SEOUL = (() => {
  const R = rng(2026), Y0 = 740, MIDW = 2700;
  const sky = mk(W, Y0), far = mk(2400, Y0), mid = mk(MIDW, Y0), ref = mk(MIDW, 170);
  const beacons = [], twinkle = [];

  { // 하늘
    const g = sky.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, Y0);
    gr.addColorStop(0, '#03050f'); gr.addColorStop(0.5, '#0d1233'); gr.addColorStop(0.8, '#2a1a4a'); gr.addColorStop(1, '#5a2855');
    g.fillStyle = gr; g.fillRect(0, 0, W, Y0);
    for (let i = 0; i < 260; i++) {
      const x = R() * W, y = R() * Y0 * 0.6, r = R() * 1.3 + 0.3;
      g.fillStyle = `rgba(255,255,255,${0.3 + R() * 0.6})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    const mg = g.createRadialGradient(1560, 140, 0, 1560, 140, 170);
    mg.addColorStop(0, 'rgba(255,240,220,.35)'); mg.addColorStop(1, 'rgba(255,240,220,0)');
    g.fillStyle = mg; g.fillRect(1380, 0, 360, 330);
    g.fillStyle = '#fff4e0'; g.beginPath(); g.arc(1560, 140, 30, 0, 7); g.fill();
    const hg = g.createLinearGradient(0, Y0 - 280, 0, Y0);
    hg.addColorStop(0, 'rgba(255,120,160,0)'); hg.addColorStop(1, 'rgba(255,140,120,.38)');
    g.fillStyle = hg; g.fillRect(0, Y0 - 280, W, 280);
  }

  const towerX = 820;
  const ridgeY = (x, base, amp, seed, hill) =>
    base - amp * (0.5 + 0.5 * Math.sin(x * 0.004 + seed)) - amp * 0.4 * Math.sin(x * 0.011 + seed * 2)
    - (hill ? 90 * Math.exp(-((x - towerX) ** 2) / (2 * 160 ** 2)) : 0);
  let towerTop = 0;
  { // 산 능선 + 남산 N서울타워 + 먼 도시 불빛
    const g = far.getContext('2d'), w = far.width;
    for (const [base, amp, col, seed, hill] of [[560, 70, '#141836', 3.3, false], [610, 40, '#0c0f24', 1, true]]) {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, Y0);
      for (let x = 0; x <= w; x += 16) g.lineTo(x, ridgeY(x, base, amp, seed, hill));
      g.lineTo(w, Y0); g.closePath(); g.fill();
    }
    for (let i = 0; i < 1100; i++) {
      const x = R() * w, y0 = ridgeY(x, 610, 40, 1, true) + 12, y = y0 + R() * (Y0 - y0);
      g.fillStyle = R() < 0.7 ? `rgba(255,200,140,${0.25 + R() * 0.5})` : `rgba(170,210,255,${0.25 + R() * 0.5})`;
      g.fillRect(x, y, 1.6, 1.6);
    }
    const yb = ridgeY(towerX, 610, 40, 1, true), py = yb - 200;
    g.fillStyle = '#1a1f3d';
    g.beginPath(); g.moveTo(towerX - 22, yb); g.lineTo(towerX - 9, yb - 60); g.lineTo(towerX + 9, yb - 60); g.lineTo(towerX + 22, yb); g.fill();
    g.fillRect(towerX - 9, py + 30, 18, yb - py - 30);
    const lg = g.createLinearGradient(0, yb, 0, py);
    lg.addColorStop(0, 'rgba(90,160,255,0)'); lg.addColorStop(1, 'rgba(140,190,255,.8)');
    g.fillStyle = lg; g.fillRect(towerX - 9, py + 30, 18, yb - py - 30);
    g.fillStyle = '#232a52'; g.fillRect(towerX - 30, py, 60, 34); g.fillRect(towerX - 24, py - 14, 48, 14);
    g.save(); g.shadowColor = '#ffd79a'; g.shadowBlur = 16;
    g.fillStyle = '#ffe8b0'; g.fillRect(towerX - 30, py + 12, 60, 5);
    g.fillStyle = '#9fd8ff'; g.fillRect(towerX - 24, py - 8, 48, 3); g.restore();
    g.fillStyle = '#2a3160'; g.fillRect(towerX - 3, py - 120, 6, 106);
    towerTop = py - 122;
  }

  function building(g, x, y, w, h, dark) {

function bgStage(t, a, b, amt) {
  SEOUL.draw(t);
  const g1 = ctx.createRadialGradient(CX + Math.sin(t * 0.6) * 420, CY - 120, 0, CX, CY, 1150);
  g1.addColorStop(0, hexA(a, 0.22 * amt)); g1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g1; ctx.fillRect(-200, -200, W + 400, H + 400);
  const g2 = ctx.createRadialGradient(CX - Math.cos(t * 0.5) * 520, CY + 260, 0, CX, CY + 200, 900);
  g2.addColorStop(0, hexA(b, 0.18 * amt)); g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(-200, -200, W + 400, H + 400);
  beams(t, a, b, amt * 0.6, 1);
  const fl = ctx.createLinearGradient(0, H - 320, 0, H);
  fl.addColorStop(0, 'rgba(0,0,0,0)'); fl.addColorStop(1, hexA(b, 0.35 * amt));
  ctx.fillStyle = fl; ctx.fillRect(-200, H - 320, W + 400, 520);
}
function beams(t, a, b, amt, speed) {

    const col = i % 2 ? a : b;
    ctx.save(); ctx.translate(W * (i + 0.5) / 6, -40); ctx.rotate(Math.sin(t * 0.9 * speed + i * 1.3) * 0.45);
    const g = ctx.createLinearGradient(0, 0, 0, H * 1.3);

    ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(150, H * 1.3); ctx.lineTo(-150, H * 1.3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function ledWall(t, col, amt) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = hexA(col, 0.4 * amt); ctx.beginPath();
  for (let y = 24; y < H; y += 48) for (let x = 24; x < W; x += 48) {

}

  ctx.fillStyle = hexA(col, amt);

  }

}

  for (let i = 0; i < n; i++) {
    const x = hash(i * 3.1) * W, spd = 60 + hash(i * 5.7) * 140;
    const y = (hash(i * 1.7) * (H + 100) + t * spd) % (H + 100) - 50;

const DEFAULT_LYRICS = `3.9 5.6 눈을 감아도 보여, 너의 빛

let LYR = [];
function parseLyrics(src) {
  LYR = src.split('\n').map(l => l.trim().match(/^(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(.+)$/)).filter(Boolean)
    .map(m => ({ a: +m[1], b: +m[2], s: m[3] })).filter(l => l.b > l.a);

parseLyrics(DEFAULT_LYRICS);
function drawLyrics(t) {

  const size = 58, o = { weight: 800, font: KFONT, spacing: 2 };
  const fin = P(t, L.a, L.a + 0.15), al = Math.min(fin, 1 - P(t, L.b - 0.2, L.b));

function triple(t, bt, k) {

                   u16(0), u16(0), u16(isV ? 0 : 0x100), u16(0), MATRIX, u32(isV ? tr.w * 65536 : 0), u32(isV ? tr.h * 65536 : 0));
  const mdhd = box('mdhd', full(0, 0), u32(0), u32(0), u32(tr.timescale), u32(dur), u16(0x55c4), u16(0));
  const hdlr = box('hdlr', full(0, 0), u32(0), TE.encode(isV ? 'vide' : 'soun'), u32(0), u32(0), u32(0), TE.encode(isV ? 'VideoHandler\0' : 'SoundHandler\0'));
  const xmhd = isV ? box('vmhd', full(0, 1), u16(0), u16(0), u16(0), u16(0)) : box('smhd', full(0, 0), u16(0), u16(0));
  const dinf = box('dinf', box('dref', full(0, 0), u32(1), box('url ', full(0, 1))));
  const r = rle(tr.deltas);
  const stbl = [box('stsd', full(0, 0), u32(1), tr.entry), box('stts', full(0, 0), u32(r.length), r.flatMap(([c, d]) => [...u32(c), ...u32(d)]))];
  if (isV) { const keys = tr.samples.map((s, i) => s.key ? i + 1 : 0).filter(Boolean); stbl.push(box('stss', full(0, 0), u32(keys.length), keys.flatMap(u32))); }
  stbl.push(box('stsc', full(0, 0), u32(1), u32(1), u32(N), u32(1)),
            box('stsz', full(0, 0), u32(0), u32(N), tr.samples.flatMap(s => u32(s.data.length))),
            box('stco', full(0, 0), u32(1), u32(off)));
  return box('trak', tkhd, box('mdia', mdhd, hdlr, box('minf', xmhd, dinf, box('stbl', ...stbl))));
}
function mp4Mux(tracks) {
  const ftyp = box('ftyp', TE.encode('isom'), u32(0x200), TE.encode('isomiso2avc1mp41'));
  const ms = Math.max(...tracks.map(tr => Math.round(tr.deltas.reduce((a, b) => a + b, 0) / tr.timescale * 1000)));
  const mvhd = box('mvhd', full(0, 0), u32(0), u32(0), u32(1000), u32(ms), u32(0x10000), u16(0x100), u16(0),
                   u32(0), u32(0), MATRIX, new Array(24).fill(0), u32(tracks.length + 1));
  const build = offs => box('moov', mvhd, ...tracks.map((tr, i) => trak(tr, i + 1, offs[i])));
  const sizes = tracks.map(tr => tr.samples.reduce((a, s) => a + s.data.length, 0));
  let o = ftyp.length + build(tracks.map(() => 0)).length + 8;
  const offs = sizes.map(s => { const r = o; o += s; return r; });
  const moov = build(offs);
  return new Blob([ftyp, moov, new Uint8Array(u32(sizes.reduce((a, b) => a + b, 0) + 8)), TE.encode('mdat'),
                   ...tracks.flatMap(tr => tr.samples.map(s => s.data))], { type: 'video/mp4' });
}
const toU8 = d => (d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer, d.byteOffset, d.byteLength)).slice();

async function encodeAudio(buf) {
  if (!window.AudioEncoder || !buf) return null;
  const sr = buf.sampleRate, ch = buf.numberOfChannels;
  const cands = [
    { kind: 'aac', cfg: { codec: 'mp4a.40.2', sampleRate: sr, numberOfChannels: ch, bitrate: 192000, aac: { format: 'aac' } } },
    { kind: 'opus', cfg: { codec: 'opus', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 } },
  ];
  let pick = null;
  for (const c of cands) { try { if ((await AudioEncoder.isConfigSupported(c.cfg)).supported) { pick = c; break; } } catch (e) {} }
  if (!pick) return null;
  const samples = [], deltas = []; let desc = null, err = null;
  const enc = new AudioEncoder({
    output: (chunk, meta) => {
      const d = meta && meta.decoderConfig && meta.decoderConfig.description; if (d && !desc) desc = toU8(d);
      const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); samples.push({ data: b, key: true });
      deltas.push(chunk.duration ? Math.round(chunk.duration * sr / 1e6) : (pick.kind === 'aac' ? 1024 : 960));
    },
    error: e => { err = e; },
  });
  enc.configure(pick.cfg);
  const L = buf.length, STEP = 4800, chans = [...Array(ch)].map((_, i) => buf.getChannelData(i));
  for (let i = 0; i < L; i += STEP) {
    const n = Math.min(STEP, L - i), data = new Float32Array(n * ch);
    for (let c = 0; c < ch; c++) data.set(chans[c].subarray(i, i + n), c * n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(i / sr * 1e6), data });
    enc.encode(ad); ad.close();
  }
  await enc.flush(); enc.close();
  if (err || !samples.length) return null;
  return { kind: 'audio', samples, deltas, timescale: sr, entry: audioEntry(pick.kind, desc, sr, ch), codec: pick.kind };
}

async function exportMP4(onProgress = () => {}, opt = {}) {
  if (!window.VideoEncoder) throw new Error('이 브라우저는 WebCodecs(VideoEncoder)를 지원하지 않습니다. 최신 Chrome/Edge를 사용해 주세요.');
  let cfg;
  const light = opt.light || ($('quality') && $('quality').value === 'light');
  const list = light ? [{ codec: 'avc1.640028', fps: 30 }, { codec: 'avc1.42E028', fps: 30 }]
                     : [{ codec: 'avc1.64002A', fps: 60 }, { codec: 'avc1.640028', fps: 30 }, { codec: 'avc1.42E028', fps: 30 }];
  for (const o of list) {
    const c = { codec: o.codec, width: W, height: H, bitrate: light ? 3e6 : 16e6, framerate: o.fps, avc: { format: 'avc' } };
    if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = { c, fps: o.fps }; break; }
  }
  if (!cfg) throw new Error('H.264 인코딩을 지원하지 않는 브라우저입니다.');
  const samples = []; let avcC = null, err = null;
  const venc = new VideoEncoder({
    output: (chunk, meta) => {
      const d = meta && meta.decoderConfig && meta.decoderConfig.description; if (d && !avcC) avcC = toU8(d);
      const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); samples.push({ data: b, key: chunk.type === 'key' });
    },
    error: e => { err = e; },
  });
  venc.configure(cfg.c);
  const fps = cfg.fps, N = DUR * fps, us = 1e6 / fps;
  exporting = true;
  try {
    for (let i = 0; i < N; i++) {
      if (err) throw err;
      render(i / fps);
      const f = new VideoFrame(cv, { timestamp: Math.round(i * us), duration: Math.round(us) });
      venc.encode(f, { keyFrame: i % fps === 0 }); f.close();
      while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (i % 10 === 0) { onProgress(0.95 * i / N); await new Promise(r => setTimeout(r, 0)); }
    }
    await venc.flush(); venc.close();
    if (err) throw err;
    if (!avcC) throw new Error('인코더가 코덱 설정(avcC)을 반환하지 않았습니다.');
    const vt = { kind: 'video', samples, deltas: samples.map(() => 100), timescale: fps * 100, entry: videoEntry(avcC, W, H), w: W, h: H };
    await musicReady;
    const at = await encodeAudio(await audioReady);
    lastExportInfo = { fps, videoFrames: samples.length, audio: at ? at.codec : 'none', audioFrames: at ? at.samples.length : 0 };
    onProgress(1);
    return mp4Mux(at ? [vt, at] : [vt]);
  } finally { exporting = false; }
}
let lastExportInfo = null;
window.exportMP4 = exportMP4;
window.getExportInfo = () => lastExportInfo;

// =====================================================================
// 6) 플레이어
// =====================================================================
let playing = false, cur = 0, pbase = 0, exporting = false, poster = true;
let actx = null, src = null, gainN = null, t0 = 0, audioBuf = null;
const setStatus = s => { $('status').textContent = s; };
let beatBuf = null, songRaw = null, songName = '';
const musicReady = makeMusic().then(b => { beatBuf = audioBuf = b; setStatus(srcImg ? $('status').textContent : '비트 준비 완료 · 이미지를 불러와 주세요'); return b; })
  .catch(e => { setStatus('오디오 생성 실패: ' + e.message); return null; });
let audioReady = musicReady;

// 업로드한 곡(보컬 포함)을 15초로 잘라 비트와 교체 또는 믹스
async function rebuildAudio() {
  await musicReady;
  const mode = $('amode').value, off = Math.max(0, +$('aoff').value || 0);
  if (mode === 'beat' || !songRaw) { audioBuf = beatBuf; return audioBuf; }
  const SR = 48000, oc = new OfflineAudioContext(2, SR * DUR, SR);
  const g = oc.createGain();
  const vol = mode === 'mix' ? 0.85 : 1;
  g.gain.setValueAtTime(0.0001, 0); g.gain.linearRampToValueAtTime(vol, 0.05);
  g.gain.setValueAtTime(vol, DUR - 0.5); g.gain.linearRampToValueAtTime(0.0001, DUR);
  g.connect(oc.destination);
  const s = oc.createBufferSource(); s.buffer = songRaw; s.connect(g); s.start(0, Math.min(off, Math.max(0, songRaw.duration - 0.1)));
  if (mode === 'mix' && beatBuf) {
    const bg = oc.createGain(); bg.gain.value = 0.55; bg.connect(oc.destination);
    const bs = oc.createBufferSource(); bs.buffer = beatBuf; bs.connect(bg); bs.start(0);
  }
  audioBuf = await oc.startRendering();
  return audioBuf;
}
function refreshAudio() {
  audioReady = rebuildAudio().then(b => {
    const m = $('amode').value;
    setStatus(m === 'beat' || !songRaw ? '음악: 기본 비트' : `음악: ${songName} (${m === 'mix' ? '곡+비트' : '곡만'}, ${(+$('aoff').value || 0)}초부터)`);
    if (playing) startAudio(cur);
    return b;
  }).catch(e => { setStatus('음악 처리 실패: ' + e.message); return beatBuf; });
  return audioReady;
}
async function loadSong(file) {
  if (!file) return;
  setStatus('곡 불러오는 중…');
  try {
    songRaw = await new OfflineAudioContext(2, 48000, 48000).decodeAudioData(await file.arrayBuffer());
    songName = file.name;
    if ($('amode').value === 'beat') $('amode').value = 'song';
    await refreshAudio();
  } catch (e) { setStatus('이 음악 파일을 읽지 못했습니다 (MP3/WAV/M4A 권장).'); }
}
window.loadSongURL = async url => { const r = await fetch(url); return loadSong(new File([await r.blob()], url.split('/').pop())); };

function stopAudio() { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; } }
function startAudio(off) {
  stopAudio();
  if (!audioBuf) return;
  if (!actx) { actx = new AudioContext({ sampleRate: 48000 }); gainN = actx.createGain(); gainN.connect(actx.destination); }
  actx.resume();
  gainN.gain.value = $('mute').checked ? 0 : 1;
  src = actx.createBufferSource(); src.buffer = audioBuf; src.connect(gainN); src.start(0, off);
  t0 = actx.currentTime - off;
}
function play() { poster = false; if (cur >= DUR - 0.02) cur = 0; playing = true; pbase = performance.now() - cur * 1000; startAudio(cur); setPlayLabel(); }
function pause() { playing = false; stopAudio(); setPlayLabel(); }
function seek(t) { cur = t; poster = false; if (playing) { pbase = performance.now() - t * 1000; startAudio(t); } }
function setPlayLabel() { $('play').textContent = playing ? '⏸ 일시정지' : '▶ 재생'; }

function loop(now) {
  if (!exporting) {
    if (playing) {
      cur = src ? actx.currentTime - t0 : (now - pbase) / 1000;
      if (cur >= DUR) { cur = 0; pbase = now; startAudio(0); }
    }
    render(poster ? 11.6 : cur);
    $('scrub').value = cur.toFixed(2);
    $('tc').textContent = `00:${String(Math.floor(cur)).padStart(2, '0')} / 00:15`;
  }
  requestAnimationFrame(loop);
}

$('play').onclick = () => (playing ? pause() : play());
$('restart').onclick = () => { cur = 0; play(); };
$('scrub').oninput = e => seek(+e.target.value);
$('mute').onchange = () => { if (gainN) gainN.gain.value = $('mute').checked ? 0 : 1; };
$('layout').onchange = $('key').onchange = () => { if (srcImg) buildShots(srcImg); };
$('music').onchange = e => loadSong(e.target.files[0]);
$('amode').onchange = $('aoff').onchange = () => refreshAudio();
$('lyrics').value = DEFAULT_LYRICS;
const onLyrics = () => { $('lyrinfo').textContent = `자막 ${parseLyrics($('lyrics').value)}줄 적용됨`; };
$('lyrics').oninput = onLyrics; onLyrics();

function loadImageURL(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { srcImg = im; buildShots(im); $('drop').classList.add('hide'); res(); };
    im.onerror = () => { setStatus('이미지를 읽지 못했습니다.'); rej(new Error('image load failed')); };
    im.src = url;
  });
}
window.loadImageURL = loadImageURL;
const loadFile = f => {
  if (!f) return;
  if (f.type.startsWith('image/')) loadImageURL(URL.createObjectURL(f));
  else if (f.type.startsWith('audio/') || /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(f.name)) loadSong(f);
};
$('file').onchange = e => loadFile(e.target.files[0]);
addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
addEventListener('dragleave', () => $('drop').classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); loadFile(e.dataTransfer.files[0]); });

$('mp4').onclick = async () => {
  const btn = $('mp4'), was = playing; if (was) pause();
  btn.disabled = true;
  try {
    const blob = await exportMP4(p => { btn.textContent = `렌더링 ${Math.round(p * 100)}%`; });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'neon-heart-mv-15s.mp4'; a.click();
    const info = lastExportInfo; setStatus(`MP4 완료 · ${info.fps}fps · 오디오 ${info.audio === 'none' ? '없음(브라우저 미지원)' : info.audio.toUpperCase()}`);
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = '⬇ MP4 다운로드';
};

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(loop));
</script>
</body>
